# Supabase local/deployment configuration for this project.
[functions.send-frro-reminders]
# The function validates FRRO_REMINDER_FUNCTION_SECRET itself.
verify_jwt = false

[functions.send-push]
enabled = true
verify_jwt = false
import_map = "./functions/send-push/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-push/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-push/*.html" ]

[functions.send-admin-announcement]
enabled = true
verify_jwt = false
import_map = "./functions/send-admin-announcement/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-admin-announcement/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-admin-announcement/*.html" ]
